name: Build Learnova Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Learnova APK + AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore permanent release keystore
        env:
          LEARNOVA_KEYSTORE_BASE64: ${{ secrets.LEARNOVA_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${LEARNOVA_KEYSTORE_BASE64:-}" ]; then
            echo "::error::LEARNOVA_KEYSTORE_BASE64 secret is missing."
            echo "Add the permanent Learnova keystore as a GitHub Actions secret before building a release."
            exit 1
          fi
          CLEAN_BASE64=$(printf '%s' "$LEARNOVA_KEYSTORE_BASE64" | tr -d '[:space:]')
          case $((${#CLEAN_BASE64} % 4)) in
            2) CLEAN_BASE64="$CLEAN_BASE64==" ;;
            3) CLEAN_BASE64="$CLEAN_BASE64=" ;;
          esac
          printf '%s' "$CLEAN_BASE64" | base64 --decode > learnova-release.keystore
          chmod 600 learnova-release.keystore
          test -s learnova-release.keystore

      - name: Verify signing configuration
        env:
          LEARNOVA_STORE_PASSWORD: ${{ secrets.LEARNOVA_STORE_PASSWORD }}
          LEARNOVA_KEY_ALIAS: ${{ secrets.LEARNOVA_KEY_ALIAS }}
          LEARNOVA_KEY_PASSWORD: ${{ secrets.LEARNOVA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${LEARNOVA_STORE_PASSWORD:-}" || { echo "::error::LEARNOVA_STORE_PASSWORD secret is missing."; exit 1; }
          test -n "${LEARNOVA_KEY_ALIAS:-}" || { echo "::error::LEARNOVA_KEY_ALIAS secret is missing."; exit 1; }
          test -n "${LEARNOVA_KEY_PASSWORD:-}" || { echo "::error::LEARNOVA_KEY_PASSWORD secret is missing."; exit 1; }
          keytool -list -keystore learnova-release.keystore -storepass "$LEARNOVA_STORE_PASSWORD" -alias "$LEARNOVA_KEY_ALIAS" >/dev/null

      - name: Build Release APK and AAB
        env:
          LEARNOVA_KEYSTORE_PATH: ${{ github.workspace }}/learnova-release.keystore
          LEARNOVA_STORE_PASSWORD: ${{ secrets.LEARNOVA_STORE_PASSWORD }}
          LEARNOVA_KEY_ALIAS: ${{ secrets.LEARNOVA_KEY_ALIAS }}
          LEARNOVA_KEY_PASSWORD: ${{ secrets.LEARNOVA_KEY_PASSWORD }}
        run: gradle clean assembleRelease bundleRelease --stacktrace

      - name: Find Generated APK and AAB
        id: find_outputs
        shell: bash
        run: |
          APK=$(find . -type f -path '*/build/outputs/apk/release/*.apk' | head -n 1)
          AAB=$(find . -type f -path '*/build/outputs/bundle/release/*.aab' | head -n 1)

          if [ -z "$APK" ]; then
            echo "No release APK was generated."
            find . -type f -name '*.apk' -print
            exit 1
          fi

          if [ -z "$AAB" ]; then
            echo "No release AAB was generated."
            find . -type f -name '*.aab' -print
            exit 1
          fi

          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "aab_path=$AAB" >> "$GITHUB_OUTPUT"

      - name: Prepare Learnova APK and AAB
        run: |
          cp "${{ steps.find_outputs.outputs.apk_path }}" Learnova.apk
          cp "${{ steps.find_outputs.outputs.aab_path }}" Learnova.aab

      - name: Generate SHA-256
        run: |
          sha256sum Learnova.apk | tee Learnova.apk.sha256
          sha256sum Learnova.aab | tee Learnova.aab.sha256

      - name: Upload Learnova build
        uses: actions/upload-artifact@v4
        with:
          name: Learnova-APK-AAB
          path: |
            Learnova.apk
            Learnova.apk.sha256
            Learnova.aab
            Learnova.aab.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: learnova-v1.1.${{ github.run_number }}
          name: Learnova v1.1.${{ github.run_number }}
          generate_release_notes: true
          files: |
            Learnova.apk
            Learnova.apk.sha256
            Learnova.aab
            Learnova.aab.sha256

      - name: Remove signing material
        if: always()
        run: rm -f learnova-release.keystore

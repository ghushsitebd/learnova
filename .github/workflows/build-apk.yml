name: Build Learnova Release APK
# CI checkpoint: verify permanent signing pipeline.
# CI trigger checkpoint: release validation runs before performance stages.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Learnova APK + AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore current Learnova release keystore
        env:
          LEARNOVA_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${LEARNOVA_KEYSTORE_BASE64:-}" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing."
            echo "Add the permanent Learnova keystore as a GitHub Actions secret before building a release."
            exit 1
          fi
          CLEAN_BASE64=$(printf '%s' "$LEARNOVA_KEYSTORE_BASE64" | tr -d '[:space:]')
          CLEAN_BASE64=$(printf '%s' "$CLEAN_BASE64" | tr '_-' '/+')
          CLEAN_BASE64=$(printf '%s' "$CLEAN_BASE64" | tr -cd 'A-Za-z0-9+/=')
          case $((${#CLEAN_BASE64} % 4)) in
            2) CLEAN_BASE64="$CLEAN_BASE64==" ;;
            3) CLEAN_BASE64="$CLEAN_BASE64=" ;;
            1) echo "::error::Keystore Base64 has an invalid length."; exit 1 ;;
          esac
          printf '%s' "$CLEAN_BASE64" | base64 --decode --ignore-garbage > learnova-release.keystore
          chmod 600 learnova-release.keystore
          test -s learnova-release.keystore
          file learnova-release.keystore

      - name: Verify and normalize signing keystore
        env:
          LEARNOVA_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          LEARNOVA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${LEARNOVA_STORE_PASSWORD:-}" || { echo "::error::KEYSTORE_PASSWORD secret is missing."; exit 1; }
          test -n "${LEARNOVA_KEY_PASSWORD:-}" || { echo "::error::KEY_PASSWORD secret is missing."; exit 1; }

          # Remove only accidental line-ending characters from pasted secrets.
          LEARNOVA_STORE_PASSWORD=$(printf '%s' "$LEARNOVA_STORE_PASSWORD" | tr -d '\r\n')
          LEARNOVA_KEY_PASSWORD=$(printf '%s' "$LEARNOVA_KEY_PASSWORD" | tr -d '\r\n')

          echo "Checking original keystore password..."
          if ! keytool -list -v -keystore learnova-release.keystore -storepass "$LEARNOVA_STORE_PASSWORD" >/tmp/learnova-keytool.txt 2>/tmp/learnova-keytool.err; then
            echo "::error::KEYSTORE_PASSWORD does not unlock the restored keystore."
            cat /tmp/learnova-keytool.err
            exit 1
          fi

          LEARNOVA_KEY_ALIAS=$(awk -F': ' '/^Alias name: / {print $2; exit}' /tmp/learnova-keytool.txt)
          if [ -z "${LEARNOVA_KEY_ALIAS:-}" ]; then
            echo "::error::No signing alias was found in the keystore."
            exit 1
          fi

          echo "Checking original signing key password..."
          if ! keytool -certreq -keystore learnova-release.keystore -storepass "$LEARNOVA_STORE_PASSWORD" -alias "$LEARNOVA_KEY_ALIAS" -keypass "$LEARNOVA_KEY_PASSWORD" -file /tmp/learnova-test.csr -dname "CN=Learnova CI Test" >/tmp/learnova-csr.out 2>/tmp/learnova-csr.err; then
            echo "::error::KEY_PASSWORD does not unlock the Learnova signing key."
            cat /tmp/learnova-csr.err
            rm -f /tmp/learnova-test.csr
            exit 1
          fi
          rm -f /tmp/learnova-test.csr

          # Re-wrap the SAME private key and certificate into a temporary JKS.
          # This gives Gradle ASCII-only passwords without changing the signing identity.
          NORMALIZED_STORE_PASSWORD=$(openssl rand -hex 32)
          NORMALIZED_KEY_PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$NORMALIZED_STORE_PASSWORD"
          echo "::add-mask::$NORMALIZED_KEY_PASSWORD"

          echo "Creating temporary normalized signing keystore..."
          keytool -importkeystore -noprompt             -srckeystore learnova-release.keystore             -srcstorepass "$LEARNOVA_STORE_PASSWORD"             -srcalias "$LEARNOVA_KEY_ALIAS"             -srckeypass "$LEARNOVA_KEY_PASSWORD"             -destkeystore learnova-release-normalized.jks             -deststoretype JKS             -deststorepass "$NORMALIZED_STORE_PASSWORD"             -destkeypass "$NORMALIZED_KEY_PASSWORD"             -destalias "$LEARNOVA_KEY_ALIAS"

          chmod 600 learnova-release-normalized.jks
          test -s learnova-release-normalized.jks

          echo "Verifying normalized keystore..."
          keytool -list -keystore learnova-release-normalized.jks -storepass "$NORMALIZED_STORE_PASSWORD" >/dev/null
          keytool -certreq -keystore learnova-release-normalized.jks             -storepass "$NORMALIZED_STORE_PASSWORD"             -alias "$LEARNOVA_KEY_ALIAS"             -keypass "$NORMALIZED_KEY_PASSWORD"             -file /tmp/learnova-normalized-test.csr             -dname "CN=Learnova CI Normalized Test" >/dev/null
          rm -f /tmp/learnova-normalized-test.csr

          mv learnova-release-normalized.jks learnova-release.keystore

          echo "LEARNOVA_KEYSTORE_PATH=$GITHUB_WORKSPACE/learnova-release.keystore" >> "$GITHUB_ENV"
          echo "LEARNOVA_STORE_PASSWORD=$NORMALIZED_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "LEARNOVA_KEY_PASSWORD=$NORMALIZED_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "LEARNOVA_KEY_ALIAS=$LEARNOVA_KEY_ALIAS" >> "$GITHUB_ENV"

          echo "Signing keystore normalized successfully."

      - name: Validate vehicle asset contracts
        run: |
          set -euo pipefail
          python3 tools/validate_vehicle_assets.py

      - name: Build Release APK and AAB
        run: |
          set -euo pipefail
          test -n "${LEARNOVA_KEYSTORE_PATH:-}"
          test -n "${LEARNOVA_STORE_PASSWORD:-}"
          test -n "${LEARNOVA_KEY_ALIAS:-}"
          test -n "${LEARNOVA_KEY_PASSWORD:-}"
          gradle clean assembleRelease bundleRelease --stacktrace

      - name: Compile production-like benchmark variant
        run: |
          set -euo pipefail
          # CI validates the non-debuggable benchmark variant even when no physical
          # Android device is attached. Runtime Macrobenchmark execution remains a
          # device task; this step catches variant/AGP/dependency regressions early.
          gradle :app:assembleBenchmark :macrobenchmark:assembleBenchmark --stacktrace

      - name: Validate benchmark outputs
        run: |
          set -euo pipefail
          BENCHMARK_APK=$(find app/build/outputs/apk/benchmark -type f -name '*.apk' | head -n 1)
          BENCHMARK_TEST_APK=$(find macrobenchmark/build/outputs/apk/benchmark -type f -name '*.apk' | head -n 1)
          test -n "$BENCHMARK_APK" || { echo "::error::Learnova benchmark APK was not generated."; exit 1; }
          test -n "$BENCHMARK_TEST_APK" || { echo "::error::Macrobenchmark test APK was not generated."; exit 1; }
          echo "Benchmark target: $BENCHMARK_APK"
          echo "Benchmark test:   $BENCHMARK_TEST_APK"
          sha256sum "$BENCHMARK_APK" "$BENCHMARK_TEST_APK"

      - name: Find Generated APK and AAB
        id: find_outputs
        shell: bash
        run: |
          APK=$(find . -type f -path '*/build/outputs/apk/release/*.apk' | head -n 1)
          AAB=$(find . -type f -path '*/build/outputs/bundle/release/*.aab' | head -n 1)

          if [ -z "$APK" ]; then
            echo "No release APK was generated."
            find . -type f -name '*.apk' -print
            exit 1
          fi

          if [ -z "$AAB" ]; then
            echo "No release AAB was generated."
            find . -type f -name '*.aab' -print
            exit 1
          fi

          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          echo "aab_path=$AAB" >> "$GITHUB_OUTPUT"

      - name: Prepare Learnova APK and AAB
        run: |
          cp "${{ steps.find_outputs.outputs.apk_path }}" Learnova.apk
          cp "${{ steps.find_outputs.outputs.aab_path }}" Learnova.aab

      - name: Verify Baseline Profile packaging
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)
          AAB=$(find app/build/outputs/bundle/release -type f -name '*.aab' | head -n 1)
          test -n "$APK" || { echo "::error::Release APK not found."; exit 1; }
          test -n "$AAB" || { echo "::error::Release AAB not found."; exit 1; }

          APK_PROFILE=$(unzip -Z1 "$APK" | grep -Fx 'assets/dexopt/baseline.prof' || true)
          AAB_PROFILE=$(unzip -Z1 "$AAB" | grep -Fx 'BUNDLE-METADATA/com.android.tools.build.profiles/baseline.prof' || true)

          if [ -n "$APK_PROFILE" ] && [ -n "$AAB_PROFILE" ]; then
            echo "Baseline Profile verified in APK: $APK_PROFILE"
            echo "Baseline Profile verified in AAB: $AAB_PROFILE"
          else
            echo "::error::Release APK/AAB is missing the required Baseline Profile."
            echo "Expected APK entry: assets/dexopt/baseline.prof"
            echo "Expected AAB entry: BUNDLE-METADATA/com.android.tools.build.profiles/baseline.prof"
            echo "Checked-in source profile:"
            git ls-files --error-unmatch app/src/release/generated/baselineProfiles/baseline-prof.txt
            exit 1
          fi

      - name: Verify APK and AAB integrity
        shell: bash
        run: |
          set -euo pipefail
          APK="Learnova.apk"
          AAB="Learnova.aab"
          test -s "$APK"
          test -s "$AAB"

          echo "== APK signature =="
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          ZIPALIGN="$ANDROID_HOME/build-tools/36.0.0/zipalign"
          test -x "$APKSIGNER" || { echo "::error::apksigner not found at $APKSIGNER"; exit 1; }
          test -x "$ZIPALIGN" || { echo "::error::zipalign not found at $ZIPALIGN"; exit 1; }
          "$APKSIGNER" verify --verbose --print-certs "$APK"

          echo "== APK alignment =="
          "$ZIPALIGN" -c -P 4 -v 4 "$APK"

          echo "== AAB signature/container =="
          JARSIGNER_OUTPUT_FILE="/tmp/learnova-aab-jarsigner.txt"
          if ! jarsigner -verify "$AAB" >"$JARSIGNER_OUTPUT_FILE" 2>&1; then
            cat "$JARSIGNER_OUTPUT_FILE"
            echo "::error::AAB jarsigner verification failed."
            exit 1
          fi
          cat "$JARSIGNER_OUTPUT_FILE"
          echo "AAB jarsigner verification command completed successfully."

          echo "Integrity validation passed."

      - name: Generate SHA-256
        run: |
          sha256sum Learnova.apk | tee Learnova.apk.sha256
          sha256sum Learnova.aab | tee Learnova.aab.sha256

      - name: Upload Learnova build
        uses: actions/upload-artifact@v4
        with:
          name: Learnova-APK-AAB
          path: |
            Learnova.apk
            Learnova.apk.sha256
            Learnova.aab
            Learnova.aab.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: learnova-v1.1.${{ github.run_number }}
          name: Learnova v1.1.${{ github.run_number }}
          generate_release_notes: true
          files: |
            Learnova.apk
            Learnova.apk.sha256
            Learnova.aab
            Learnova.aab.sha256

      - name: Remove signing material
        if: always()
        run: rm -f learnova-release.keystore

# CI validation checkpoint: bounded benchmark diagnostics
# CI verification trigger: run the corrected release/integrity gate before the next stage.
# CI checkpoint 2026-09-30: validate current production pipeline after benchmark hardening.

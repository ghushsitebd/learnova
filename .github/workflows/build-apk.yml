name: Build Learnova Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Gradle permission
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew clean assembleRelease

      - name: Verify APK exists
        run: |
          ls -lh app/build/outputs/apk/release/
          test -f app/build/outputs/apk/release/app-release.apk

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk Learnova.apk

      - name: Generate SHA-256
        run: |
          sha256sum Learnova.apk > Learnova.apk.sha256
          cat Learnova.apk.sha256

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Learnova-Release-APK
          path: |
            Learnova.apk
            Learnova.apk.sha256
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: learnova-v1.0.${{ github.run_number }}
          name: Learnova v1.0.${{ github.run_number }}
          generate_release_notes: true
          files: |
            Learnova.apk
            Learnova.apk.sha256

### ⚠️ কিন্তু একটি জিনিস আগে করতে হবে

এই workflow **Release APK তৈরি করবে**, কিন্তু তোমার `app/build.gradle`-এ যদি Release signing configuration না থাকে, তাহলে `assembleRelease` signed APK নাও তৈরি করতে পারে।

তাই **এখনই workflow চালাবে না।**

পরের ধাপে তোমার `app/build.gradle`-এ **secure release signing** বসাব। তারপর GitHub Secrets দিয়ে key নিরাপদে রাখব।

এতে আমরা বর্তমান:

`assembleDebug ❌`

থেকে:

`assembleRelease → signed Learnova.apk → GitHub Release → Download`

এ যাব।

**তোমার GitHub repository-তে এখন এই workflow save করো। তারপর আমাকে শুধু “হয়ে গেছে” বলো—আমি পরের ধাপের signing configuration দেব।**

name: Build Learnova Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Learnova APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check Java
        run: java -version

      - name: Check Gradle
        run: gradle --version

      - name: Build Release APK
        run: |
          gradle clean assembleRelease --stacktrace

      - name: Find Generated APK
        id: find_apk
        shell: bash
        run: |
          echo "Searching for generated APK..."

          find . -type f -name "*.apk" -print

          APK=$(find . -type f \
            \( -path "*/build/outputs/apk/release/*.apk" \
            -o -path "*/build/outputs/apk/*/*.apk" \) \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was generated."
            echo "All APK files:"
            find . -type f -name "*.apk" -print
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Prepare Learnova APK
        run: |
          APK="${{ steps.find_apk.outputs.apk_path }}"

          echo "Using APK: $APK"

          cp "$APK" Learnova.apk

          ls -lh Learnova.apk

      - name: Generate SHA-256
        run: |
          sha256sum Learnova.apk | tee Learnova.apk.sha256

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Learnova-APK
          path: |
            Learnova.apk
            Learnova.apk.sha256
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: learnova-v1.0.${{ github.run_number }}
          name: Learnova v1.0.${{ github.run_number }}
          generate_release_notes: true
          files: |
            Learnova.apk
            Learnova.apk.sha256

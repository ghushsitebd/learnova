name: Learnova Macrobenchmark

on:
  workflow_run:
    workflows: ["Build Learnova Release APK"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: Run Learnova Macrobenchmarks
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK 36 + API 35 emulator
        uses: android-actions/setup-android@v3

      - name: Install benchmark Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"
          sdkmanager "emulator"
          sdkmanager "system-images;android-35;google_apis;x86_64"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true

      - name: Verify benchmark system image
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --list_installed | grep -F "system-images;android-35;google_apis;x86_64"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run Macrobenchmarks on Gradle Managed Device
        shell: bash
        run: |
          set -euo pipefail

          gradle :app:assembleBenchmark :macrobenchmark:assembleBenchmark --stacktrace

          TASK=$(gradle :macrobenchmark:tasks --all --console=plain |
            awk '$1 ~ /^pixel2api35.*BenchmarkAndroidTest$/ {print $1; exit}')

          if [ -z "$TASK" ]; then
            echo "::error::Could not find the Pixel 2 API 35 benchmark device test task."
            gradle :macrobenchmark:tasks --all --console=plain | grep -i 'BenchmarkAndroidTest' || true
            exit 1
          fi

          echo "Executing Gradle Managed Device task: :macrobenchmark:$TASK"
          gradle ":macrobenchmark:$TASK" --stacktrace

      - name: Collect benchmark outputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p benchmark-results
          if [ -d macrobenchmark/build/outputs ]; then
            cp -R macrobenchmark/build/outputs benchmark-results/
          fi
          if [ -d macrobenchmark/build/test-results ]; then
            cp -R macrobenchmark/build/test-results benchmark-results/
          fi
          if [ -d macrobenchmark/build/reports ]; then
            cp -R macrobenchmark/build/reports benchmark-results/
          fi
          find benchmark-results -type f -maxdepth 8 -print 2>/dev/null || true

      - name: Upload Macrobenchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Learnova-Macrobenchmark-results
          path: benchmark-results
          if-no-files-found: warn

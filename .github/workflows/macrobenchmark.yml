name: Learnova Macrobenchmark

on:
  # Expensive performance measurement is deliberate, not per-commit.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: learnova-macrobenchmark
  cancel-in-progress: true

jobs:
  benchmark:
    name: Run Learnova Macrobenchmarks
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Enable KVM group permissions
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
          ls -l /dev/kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Prepare Android SDK for API 35 emulator
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/16.0/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "emulator" "platforms;android-35" "build-tools;35.0.0" "system-images;android-35;google_apis;x86_64"

      - name: Verify benchmark system image
        run: |
          set -euo pipefail
          sdkmanager --list_installed | grep -F "system-images;android-35;google_apis;x86_64"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore release signing identity for benchmark target
        env:
          LEARNOVA_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          LEARNOVA_STORE_PASSWORD_INPUT: ${{ secrets.KEYSTORE_PASSWORD }}
          LEARNOVA_KEY_PASSWORD_INPUT: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${LEARNOVA_KEYSTORE_BASE64:-}" || { echo "::error::KEYSTORE_BASE64 secret is missing."; exit 1; }
          test -n "${LEARNOVA_STORE_PASSWORD_INPUT:-}" || { echo "::error::KEYSTORE_PASSWORD secret is missing."; exit 1; }
          test -n "${LEARNOVA_KEY_PASSWORD_INPUT:-}" || { echo "::error::KEY_PASSWORD secret is missing."; exit 1; }

          CLEAN_BASE64=$(printf '%s' "$LEARNOVA_KEYSTORE_BASE64" | tr -d '[:space:]' | tr '_-' '/+' | tr -cd 'A-Za-z0-9+/=')
          case $((${#CLEAN_BASE64} % 4)) in
            2) CLEAN_BASE64="$CLEAN_BASE64==" ;;
            3) CLEAN_BASE64="$CLEAN_BASE64=" ;;
            1) echo "::error::Keystore Base64 has an invalid length."; exit 1 ;;
          esac
          printf '%s' "$CLEAN_BASE64" | base64 --decode --ignore-garbage > learnova-release.keystore
          chmod 600 learnova-release.keystore
          test -s learnova-release.keystore

          STORE_PASSWORD=$(printf '%s' "$LEARNOVA_STORE_PASSWORD_INPUT" | tr -d '\r\n')
          KEY_PASSWORD=$(printf '%s' "$LEARNOVA_KEY_PASSWORD_INPUT" | tr -d '\r\n')

          keytool -list -v -keystore learnova-release.keystore -storepass "$STORE_PASSWORD" >/tmp/learnova-keytool.txt 2>/tmp/learnova-keytool.err || {
            echo "::error::KEYSTORE_PASSWORD does not unlock the restored keystore."
            cat /tmp/learnova-keytool.err
            exit 1
          }

          KEY_ALIAS=$(awk -F': ' '/^Alias name: / {print $2; exit}' /tmp/learnova-keytool.txt)
          test -n "${KEY_ALIAS:-}" || { echo "::error::No signing alias found."; exit 1; }

          keytool -certreq -keystore learnova-release.keystore \
            -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" -keypass "$KEY_PASSWORD" \
            -file /tmp/learnova-test.csr -dname "CN=Learnova CI Test" >/dev/null
          rm -f /tmp/learnova-test.csr

          NORMALIZED_STORE_PASSWORD=$(openssl rand -hex 32)
          NORMALIZED_KEY_PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$NORMALIZED_STORE_PASSWORD"
          echo "::add-mask::$NORMALIZED_KEY_PASSWORD"

          keytool -importkeystore -noprompt \
            -srckeystore learnova-release.keystore \
            -srcstorepass "$STORE_PASSWORD" \
            -srcalias "$KEY_ALIAS" \
            -srckeypass "$KEY_PASSWORD" \
            -destkeystore learnova-release-normalized.jks \
            -deststoretype JKS \
            -deststorepass "$NORMALIZED_STORE_PASSWORD" \
            -destkeypass "$NORMALIZED_KEY_PASSWORD" \
            -destalias "$KEY_ALIAS"

          mv learnova-release-normalized.jks learnova-release.keystore
          chmod 600 learnova-release.keystore
          echo "LEARNOVA_KEYSTORE_PATH=$GITHUB_WORKSPACE/learnova-release.keystore" >> "$GITHUB_ENV"
          echo "LEARNOVA_STORE_PASSWORD=$NORMALIZED_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "LEARNOVA_KEY_PASSWORD=$NORMALIZED_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "LEARNOVA_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"

          keytool -list -keystore learnova-release.keystore -storepass "$NORMALIZED_STORE_PASSWORD" >/dev/null
          echo "Release signing identity restored and normalized for benchmark packaging."

      - name: Run Macrobenchmarks on Gradle Managed Device
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleBenchmark :macrobenchmark:assembleBenchmark --stacktrace
          TASK=$(gradle :macrobenchmark:tasks --all --console=plain |
            awk '$1 ~ /^pixel2api35.*BenchmarkAndroidTest$/ {print $1; exit}')
          if [ -z "$TASK" ]; then
            echo "::error::Could not find the Pixel 2 API 35 benchmark device test task."
            gradle :macrobenchmark:tasks --all --console=plain | grep -i 'BenchmarkAndroidTest' || true
            exit 1
          fi
          echo "Executing Gradle Managed Device task: :macrobenchmark:$TASK"
          gradle ":macrobenchmark:$TASK" --stacktrace

      - name: Capture target-app runtime diagnostics
        if: always()
        timeout-minutes: 2
        shell: bash
        run: |
          set +e
          mkdir -p benchmark-results/runtime-diagnostics
          timeout 20s adb devices -l > benchmark-results/runtime-diagnostics/adb-devices.txt 2>&1 || true
          timeout 20s adb shell dumpsys activity activities > benchmark-results/runtime-diagnostics/activity.txt 2>&1 || true
          timeout 20s adb shell dumpsys package com.learnova.app > benchmark-results/runtime-diagnostics/package.txt 2>&1 || true
          timeout 20s adb shell dumpsys gfxinfo com.learnova.app framestats > benchmark-results/runtime-diagnostics/gfxinfo.txt 2>&1 || true
          timeout 30s adb logcat -d -v threadtime -t 1200 > benchmark-results/runtime-diagnostics/logcat.txt 2>&1 || true
          grep -E 'FATAL EXCEPTION|AndroidRuntime|Process: com\\.learnova\\.app|Caused by:|UnsatisfiedLinkError|SIGSEGV|ANR|SecurityException|RuntimeException' benchmark-results/runtime-diagnostics/logcat.txt > benchmark-results/runtime-diagnostics/app-crash-summary.txt 2>&1 || true
          echo "=== APP CRASH SUMMARY ==="
          cat benchmark-results/runtime-diagnostics/app-crash-summary.txt || true
      - name: Collect benchmark outputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p benchmark-results
          if [ -d macrobenchmark/build/outputs ]; then cp -R macrobenchmark/build/outputs benchmark-results/; fi
          if [ -d macrobenchmark/build/test-results ]; then cp -R macrobenchmark/build/test-results benchmark-results/; fi
          if [ -d macrobenchmark/build/reports ]; then cp -R macrobenchmark/build/reports benchmark-results/; fi
          find benchmark-results -type f -maxdepth 8 -print 2>/dev/null || true

      - name: Upload Macrobenchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Learnova-Macrobenchmark-results
          path: benchmark-results
          if-no-files-found: warn

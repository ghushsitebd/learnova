name: Learnova Extended Build Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: learnova-extended-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  asset-regression:
    name: Asset generator and catalog regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile all project tooling
        run: python -m compileall -q tools

      - name: Generate and regression-test launch vehicle models
        run: python tools/test_vehicle_prototypes.py

      - name: Verify regression test file is tracked
        run: git diff --check

  android-build-matrix:
    name: Android compile, unit tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Verify Gradle and Android SDK
        run: |
          set -euo pipefail
          gradle --version
          sdkmanager --list_installed
          gradle projects --stacktrace

      - name: Run app unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Compile benchmark and baseline-profile test APKs
        run: |
          set -euo pipefail
          gradle :macrobenchmark:assembleBenchmark --no-daemon --stacktrace
          gradle :baseline-profile:assembleDebug --no-daemon --stacktrace

      - name: Run Android lint
        run: gradle :app:lintDebug --no-daemon --stacktrace

      - name: Verify APK outputs and checksums
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          test -s "$APK"
          sha256sum "$APK"
          if command -v apksigner >/dev/null 2>&1; then
            apksigner verify --verbose "$APK"
          else
            echo "apksigner unavailable on PATH; APK presence/hash verified, signature verification deferred to release workflow."
          fi

      - name: Upload debug build and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: learnova-extended-build-reports
          if-no-files-found: warn
          retention-days: 7
          path: |
            app/build/outputs/apk/debug/
            app/build/reports/tests/
            app/build/test-results/
            app/build/reports/lint-results-debug.html
            macrobenchmark/build/outputs/apk/
            baseline-profile/build/outputs/apk/

name: Generate Learnova Baseline Profile

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  baseline-profile:
    name: Generate Baseline Profile on Gradle Managed Device
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 emulator system-images;android-35;aosp;x86_64'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate Baseline Profile
        run: |
          set -euo pipefail
          gradle :app:generateBaselineProfile --stacktrace

      - name: Verify generated profile
        run: |
          set -euo pipefail
          PROFILE=$(find app/src -type f -path '*/generated/baselineProfiles/*' | head -n 1 || true)
          if [ -z "$PROFILE" ]; then
            PROFILE=$(find app/build/outputs -type f -iname '*baseline*' | head -n 1 || true)
          fi
          if [ -z "$PROFILE" ]; then
            echo "::error::No generated Baseline Profile was found."
            find app -type f -iname '*baseline*' -print
            exit 1
          fi
          echo "Generated profile: $PROFILE"
          wc -c "$PROFILE"
          sha256sum "$PROFILE"

      - name: Upload generated profile
        uses: actions/upload-artifact@v4
        with:
          name: Learnova-Baseline-Profile
          path: app/src/**/generated/baselineProfiles/*

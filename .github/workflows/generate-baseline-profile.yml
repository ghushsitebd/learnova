name: Generate Learnova Baseline Profile

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build Learnova Release APK"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: learnova-baseline-profile
  cancel-in-progress: true

jobs:
  baseline-profile:
    name: Generate Learnova Baseline Profile on Gradle Managed Device
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && !contains(github.event.workflow_run.head_commit.message, '[baseline-profile]')) }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Enable KVM group permissions
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
          ls -l /dev/kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Prepare Android SDK for API 35 emulator
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/cmdline-tools/16.0/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "emulator" "platforms;android-35" "build-tools;35.0.0" "system-images;android-35;default;x86_64"

      - name: Verify Gradle Managed Device system image
        run: |
          set -euo pipefail
          sdkmanager --list_installed | grep -F "system-images;android-35;default;x86_64"
          test -e /dev/kvm

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate Baseline Profile
        run: |
          set -euo pipefail
          gradle :app:generateBaselineProfile             -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=BaselineProfile             --stacktrace

      - name: Capture target-app runtime diagnostics
        if: always()
        timeout-minutes: 2
        shell: bash
        run: |
          set +e
          mkdir -p baseline-profile-runtime-diagnostics
          timeout 20s adb devices -l > baseline-profile-runtime-diagnostics/adb-devices.txt 2>&1 || true
          timeout 20s adb shell dumpsys activity activities > baseline-profile-runtime-diagnostics/activity.txt 2>&1 || true
          timeout 20s adb shell dumpsys package com.learnova.app > baseline-profile-runtime-diagnostics/package.txt 2>&1 || true
          timeout 20s adb shell dumpsys gfxinfo com.learnova.app framestats > baseline-profile-runtime-diagnostics/gfxinfo.txt 2>&1 || true
          timeout 30s adb logcat -d -v threadtime -t 1200 > baseline-profile-runtime-diagnostics/logcat.txt 2>&1 || true
          grep -E 'FATAL EXCEPTION|AndroidRuntime|Process: com\\.learnova\\.app|Caused by:|UnsatisfiedLinkError|SIGSEGV|ANR|SecurityException|RuntimeException' baseline-profile-runtime-diagnostics/logcat.txt > baseline-profile-runtime-diagnostics/app-crash-summary.txt 2>&1 || true
          echo "=== APP CRASH SUMMARY ==="
          cat baseline-profile-runtime-diagnostics/app-crash-summary.txt || true
      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Learnova-Baseline-runtime-diagnostics
          path: baseline-profile-runtime-diagnostics
          if-no-files-found: warn

      - name: Locate generated profile
        id: locate_profile
        run: |
          set -euo pipefail
          PROFILE=$(find app/src -type f -path '*/generated/baselineProfiles/*' | head -n 1 || true)
          if [ -z "$PROFILE" ]; then
            PROFILE=$(find app/build/outputs -type f -iname '*baseline*prof*.txt' | head -n 1 || true)
          fi
          if [ -z "$PROFILE" ]; then
            echo "::error::No generated Baseline Profile was found."
            find app -type f -iname '*baseline*' -print
            exit 1
          fi
          echo "Generated profile: $PROFILE"
          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"
          wc -c "$PROFILE"
          sha256sum "$PROFILE"

      - name: Validate profile size and readability
        run: |
          set -euo pipefail
          PROFILE="${{ steps.locate_profile.outputs.profile }}"
          BYTES=$(wc -c < "$PROFILE")
          test "$BYTES" -lt 1572864 || { echo "::error::Baseline Profile exceeds 1.5 MB."; exit 1; }
          test -s "$PROFILE" || { echo "::error::Generated Baseline Profile is empty."; exit 1; }
          grep -Eq '^[HLSP][LSPH]?' "$PROFILE" || { echo "::error::Generated profile does not contain recognizable ART profile rules."; exit 1; }

      - name: Persist generated Baseline Profile
        shell: bash
        run: |
          set -euo pipefail
          PROFILE="${{ steps.locate_profile.outputs.profile }}"
          TARGET="app/src/release/generated/baselineProfiles/baseline-prof.txt"
          mkdir -p "$(dirname "$TARGET")"
          if [ "$PROFILE" != "$TARGET" ]; then
            cp "$PROFILE" "$TARGET"
          fi
          if git ls-files --error-unmatch "$TARGET" >/dev/null 2>&1 && git diff --quiet -- "$TARGET"; then
            echo "Baseline Profile unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$TARGET"
          git commit -m "perf: update generated Learnova Baseline Profile [baseline-profile]"
          git push

      - name: Stage generated profile for artifact
        run: |
          set -euo pipefail
          rm -rf baseline-profile-output
          mkdir -p baseline-profile-output
          cp "${{ steps.locate_profile.outputs.profile }}" baseline-profile-output/baseline-prof.txt
          sha256sum baseline-profile-output/baseline-prof.txt

      - name: Upload generated profile
        uses: actions/upload-artifact@v4
        with:
          name: Learnova-Baseline-Profile
          path: baseline-profile-output/baseline-prof.txt
          if-no-files-found: error

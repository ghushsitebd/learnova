name: Generate Learnova Baseline Profile

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build Learnova Release APK"]
    types: [completed]

permissions:
  contents: write

jobs:
  baseline-profile:
    name: Generate Baseline Profile on Gradle Managed Device
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && !contains(github.event.workflow_run.head_commit.message, '[baseline-profile]')) }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK 36 + API 35 emulator
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            emulator
            system-images;android-35;google_apis;x86_64

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true

      - name: Verify Gradle Managed Device system image
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --list_installed | grep -F "system-images;android-35;google_apis;x86_64"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate Baseline Profile
        run: |
          set -euo pipefail
          gradle :app:generateBaselineProfile \
            -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=BaselineProfile \
            --stacktrace

      - name: Locate generated profile
        id: locate_profile
        run: |
          set -euo pipefail
          PROFILE=$(find app/src -type f -path '*/generated/baselineProfiles/*' | head -n 1 || true)
          if [ -z "$PROFILE" ]; then
            PROFILE=$(find app/build/outputs -type f -iname '*baseline*prof*.txt' | head -n 1 || true)
          fi
          if [ -z "$PROFILE" ]; then
            echo "::error::No generated Baseline Profile was found."
            find app -type f -iname '*baseline*' -print
            exit 1
          fi

          echo "Generated profile: $PROFILE"
          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"
          wc -c "$PROFILE"
          sha256sum "$PROFILE"

      - name: Validate profile size and readability
        run: |
          set -euo pipefail
          PROFILE="${{ steps.locate_profile.outputs.profile }}"
          BYTES=$(wc -c < "$PROFILE")
          test "$BYTES" -lt 1572864 || { echo "::error::Baseline Profile exceeds 1.5 MB."; exit 1; }
          test -s "$PROFILE" || { echo "::error::Generated Baseline Profile is empty."; exit 1; }
          grep -Eq '^[HLSP][LSPH]?' "$PROFILE" || { echo "::error::Generated profile does not contain recognizable ART profile rules."; exit 1; }

      - name: Persist generated Baseline Profile
        shell: bash
        run: |
          set -euo pipefail
          PROFILE="${{ steps.locate_profile.outputs.profile }}"
          TARGET="app/src/release/generated/baselineProfiles/baseline-prof.txt"
          mkdir -p "$(dirname "$TARGET")"
          cp "$PROFILE" "$TARGET"
          if git diff --quiet -- "$TARGET"; then
            echo "Baseline Profile unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$TARGET"
          git commit -m "perf: update generated Learnova Baseline Profile [baseline-profile]"
          git push

      - name: Stage generated profile for artifact
        run: |
          set -euo pipefail
          rm -rf baseline-profile-output
          mkdir -p baseline-profile-output
          cp "${{ steps.locate_profile.outputs.profile }}" baseline-profile-output/baseline-prof.txt
          sha256sum baseline-profile-output/baseline-prof.txt

      - name: Upload generated profile
        uses: actions/upload-artifact@v4
        with:
          name: Learnova-Baseline-Profile
          path: baseline-profile-output/baseline-prof.txt
          if-no-files-found: error

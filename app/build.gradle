plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def ciVersionCode = System.getenv("GITHUB_RUN_NUMBER")
def buildVersionCode = ciVersionCode != null ? ciVersionCode.toInteger() : 2
def buildVersionName = System.getenv("LEARNOVA_VERSION_NAME") ?: "1.1.0"
def releaseStorePassword = System.getenv("LEARNOVA_STORE_PASSWORD") ?: "LearnovaTest123"
def releaseKeyAlias = System.getenv("LEARNOVA_KEY_ALIAS") ?: "learnova"
def releaseKeyPassword = System.getenv("LEARNOVA_KEY_PASSWORD") ?: "LearnovaTest123"

android {
    namespace 'com.learnova.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.learnova.app'
        minSdk 23
        targetSdk 35
        versionCode buildVersionCode
        versionName buildVersionName
    }

    signingConfigs {
        release {
            storeFile file("${rootProject.projectDir}/learnova-test.keystore")
            storePassword releaseStorePassword
            keyAlias releaseKeyAlias
            keyPassword releaseKeyPassword
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }

        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
}

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def ciVersionCode = System.getenv("GITHUB_RUN_NUMBER")
def buildVersionCode = ciVersionCode != null ? ciVersionCode.toInteger() : 2
def buildVersionName = System.getenv("LEARNOVA_VERSION_NAME") ?: (ciVersionCode != null ? "1.1.${ciVersionCode}" : "1.1.0")

def releaseStorePassword = System.getenv("LEARNOVA_STORE_PASSWORD")
def releaseKeyAlias = System.getenv("LEARNOVA_KEY_ALIAS")
def releaseKeyPassword = System.getenv("LEARNOVA_KEY_PASSWORD")

android {
    namespace 'com.learnova.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.learnova.app'
        minSdk 23
        targetSdk 35
        versionCode buildVersionCode
        versionName buildVersionName
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("LEARNOVA_KEYSTORE_PATH")
            if (keystorePath && !keystorePath.trim().isEmpty() && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
                storeFile file(keystorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            def releaseTaskRequested = gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") }
            if (releaseStorePassword && releaseKeyAlias && releaseKeyPassword && System.getenv("LEARNOVA_KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
            } else if (releaseTaskRequested) {
                throw new GradleException("Release signing secrets are required for assembleRelease/bundleRelease.")
            }
        }

        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
}

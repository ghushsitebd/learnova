plugins {
id 'com.android.application'
id 'org.jetbrains.kotlin.android'
}

android {
namespace 'com.learnova.app'
compileSdk 35

defaultConfig {
    applicationId 'com.learnova.app'
    minSdk 23
    targetSdk 35

    versionCode 1
    versionName "1.0"
}

buildTypes {
    release {
        minifyEnabled false
        shrinkResources false

        // Use the standard Android debug signing key temporarily.
        // This allows GitHub Actions to build the APK without
        // requiring the missing learnova-test.keystore file.
        signingConfig signingConfigs.debug
    }

    debug {
        minifyEnabled false
    }
}

compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
}

kotlinOptions {
    jvmTarget = '17'
}

}

dependencies {
implementation 'androidx.core:core-ktx:1.15.0'
implementation 'androidx.appcompat:appcompat:1.7.0'
}

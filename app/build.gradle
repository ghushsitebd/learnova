plugins {
    id 'com.android.application'
    id 'androidx.baselineprofile'
}

def ciVersionCode = System.getenv("GITHUB_RUN_NUMBER")
def buildVersionCode = ciVersionCode != null ? ciVersionCode.toInteger() : 2
def buildVersionName = System.getenv("LEARNOVA_VERSION_NAME") ?: (ciVersionCode != null ? "1.1." + ciVersionCode : "1.1.0")

def releaseStorePassword = System.getenv("LEARNOVA_STORE_PASSWORD")
def releaseKeyAlias = System.getenv("LEARNOVA_KEY_ALIAS")
def releaseKeyPassword = System.getenv("LEARNOVA_KEY_PASSWORD")

android {
    namespace 'com.learnova.app'
    compileSdk 36

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.learnova.app'
        // GMA Next-Gen SDK requires API 24+.
        minSdk 24
        targetSdk 35
        versionCode buildVersionCode
        versionName buildVersionName
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("LEARNOVA_KEYSTORE_PATH")
            if (keystorePath && !keystorePath.trim().isEmpty() && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
                storeFile file(keystorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            buildConfigField 'boolean', 'PERF_TRACE_ENABLED', 'false'
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            def releaseTaskRequested = gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") }
            if (releaseStorePassword && releaseKeyAlias && releaseKeyPassword && System.getenv("LEARNOVA_KEYSTORE_PATH")) {
                signingConfig signingConfigs.release
            } else if (releaseTaskRequested) {
                throw new GradleException("Release signing secrets are required for assembleRelease/bundleRelease.")
            }
        }

        debug {
            minifyEnabled false
            buildConfigField 'boolean', 'PERF_TRACE_ENABLED', 'true'
        }

        benchmark {
            initWith release
            debuggable false
            // Macrobenchmark requires the tested APK to remain unobfuscated.
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
            buildConfigField 'boolean', 'PERF_TRACE_ENABLED', 'true'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.filament:filament-android:1.75.0'
    implementation 'com.google.android.filament:gltfio-android:1.75.0'
    implementation 'com.google.android.filament:filament-utils-android:1.75.0'
    implementation 'androidx.profileinstaller:profileinstaller:1.4.1'

    // Prepare the current GMA Next-Gen runtime. Real production ads remain
    // disabled until the owner's real App ID and ad-unit IDs are supplied.
    implementation 'com.google.android.libraries.ads.mobile.sdk:ads-mobile-sdk:1.5.0'

    baselineProfile project(':baseline-profile')
}
